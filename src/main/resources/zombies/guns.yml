# Atlas Zombies - gun definitions. All vanilla items; sounds are vanilla sound keys.
# damage       - per pellet/ray
# boxWeight    - mystery box weight (0 = not in the box)
# starting     - given to every player when round 1 starts

m1911:
  displayName: "&fM1911"
  material: IRON_HOE
  damage: 8
  headshotMultiplier: 1.5
  fireIntervalMillis: 250
  magazine: 8
  reserve: 80
  reloadMillis: 1200
  spreadDegrees: 1.0
  recoilPitch: 1.2
  range: 50
  fireSound: entity.firework_rocket.blast
  soundPitch: 1.8
  starting: true
  boxWeight: 10

m1_garand:
  displayName: "&eM1 Garand"
  material: CROSSBOW
  damage: 14
  headshotMultiplier: 2.0
  fireIntervalMillis: 350
  magazine: 8
  reserve: 96
  reloadMillis: 1600
  spreadDegrees: 0.6
  recoilPitch: 1.8
  range: 60
  fireSound: entity.generic.explode
  soundPitch: 1.6
  boxWeight: 10

